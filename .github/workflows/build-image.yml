---
on:
  push:
    branches: ['*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Store the content of your local vars/local file as a repository
      # variable named BUILD_VARS_LOCAL (Settings → Secrets and variables →
      # Actions → Variables tab → New repository variable).  When the variable
      # is present the file is recreated here and BUILD_PARAMS is pointed at it
      # so the build-appliance script picks it up.  When the variable is absent
      # the normal GITHUB_REF_NAME-based selection is used instead.
      - name: Create local vars file from variable
        env:
          BUILD_VARS_LOCAL: ${{ vars.BUILD_VARS_LOCAL }}
        run: |
          if [ -n "$BUILD_VARS_LOCAL" ]; then
            printf '%s' "$BUILD_VARS_LOCAL" | tr -d '\r' > vars/local
            echo "BUILD_PARAMS=vars/local" >> $GITHUB_ENV
          fi

      - name: Add VirtualBox and other dependencies
        run: |
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/oracle-virtualbox-2016.gpg] https://download.virtualbox.org/virtualbox/debian noble contrib" | sudo tee -a /etc/apt/sources.list
          wget -O- https://download.virtualbox.org/virtualbox/debian/oracle_vbox_2016.asc | sudo gpg --dearmor --yes --output /usr/share/keyrings/oracle-virtualbox-2016.gpg
          sudo apt update
          sudo apt install virtualbox-7.0 qemu-utils debootstrap dosfstools debian-keyring debian-archive-keyring

      - name: Build appliance
        run: sudo --preserve-env=GITHUB_REF_NAME,BUILD_PARAMS bash ./build-appliance
        id: build

      # GITHUB_OUTPUT is in Github Action filled with temporary
      # filename to store output. Variables are not passed thought
      # sudo. One can use `--preserve-env=` but when script is
      # executed localy, ie. without github enviroment it will
      # fail. So I think that it is better to use our own temp file
      # for name of builded appliance.
      - name: Read filename of builded appliance
        run: echo APPLIANCE_FILENAME=`cat tmp/appliance-last-name` >> $GITHUB_OUTPUT
        id: appliance_name

      - name: Read filename of original OVF file
        run: echo APPLIANCE_ORIG_OVF=`cat tmp/appliance-orig-ovf` >> $GITHUB_OUTPUT
        id: appliance_ovf

      - name: Save original OVF file
        uses: actions/upload-artifact@v7
        with:
          name: ilm-appliance-original-ovf-file
          path: "tmp/${{ steps.appliance_ovf.outputs.APPLIANCE_ORIG_OVF }}"

      - name: Save builded ILM Appliance OVA file
        uses: actions/upload-artifact@v7
        with:
          name: "${{ steps.appliance_name.outputs.APPLIANCE_FILENAME }}"
          path: "tmp/${{ steps.appliance_name.outputs.APPLIANCE_FILENAME }}"
